name: Merge to main

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  NODE_ENV: test
  CI: 1
  DATABASE_URL: postgres://postgres:password@localhost:5432/ai_ecommerce_test
  NEXT_PUBLIC_SUPABASE_URL: https://test.supabase.co
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-publishable-key
  NEXT_PUBLIC_SITE_NAME: AI Ecommerce Test
  GEMINI_API_KEY: test-gemini-api-key

jobs:
  type-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup pnpm
      uses: pnpm/action-setup@v3

    - name: Setup Node.js environment
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: TypeScript type check
      run: pnpm run type:check

  unit-test:
    runs-on: ubuntu-latest
    needs: type-check
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: ai_ecommerce_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Setup pnpm
      uses: pnpm/action-setup@v3

    - name: Setup Node.js environment
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Wait for database to be ready
      run: |
        for i in {1..30}; do
          if pg_isready -h localhost -p 5432 -U postgres; then
            echo "Database is ready!"
            break
          fi
          echo "Waiting for database... ($i/30)"
          sleep 2
        done
        if [ $i -eq 30 ]; then
          echo "Database failed to start"
          exit 1
        fi

    - name: Run unit tests with coverage
      run: pnpm run test:coverage

    - name: Upload unit test coverage
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage/lcov.info
        flags: unit-tests
        name: unit-tests-coverage

  e2e-test:
    runs-on: ubuntu-latest
    needs: type-check

    steps:
    - uses: actions/checkout@v4

    - name: Setup pnpm
      uses: pnpm/action-setup@v3

    - name: Setup Node.js environment
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Install Playwright Browsers
      run: pnpm exec playwright install --with-deps chromium

    - name: Run Playwright E2E tests
      run: pnpm run test:e2e

    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30

    - name: Upload E2E test coverage
      uses: codecov/codecov-action@v4
      if: success()
      with:
        file: ./playwright-report/coverage/lcov.info
        flags: e2e-tests
        name: e2e-tests-coverage

  status-comment:
    runs-on: ubuntu-latest
    needs: [type-check, unit-test, e2e-test]
    if: always() && (needs.type-check.result == 'success' && needs.unit-test.result == 'success' && needs.e2e-test.result == 'success')
    steps:
    - name: Comment on PR with success status
      uses: actions/github-script@v7
      with:
        script: |
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: '✅ **All checks passed!**\n\n- ✅ Linting\n- ✅ Unit tests with coverage\n- ✅ E2E tests (Chromium, Firefox, WebKit)\n\nThe code is ready to merge to master. 🚀'
          })
