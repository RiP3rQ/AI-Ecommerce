version: '3.8'

services:
  postgres-test:
    image: postgres:15-alpine
    container_name: ai-ecommerce-postgres-test
    restart: unless-stopped
    environment:
      POSTGRES_DB: ai_ecommerce_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    networks:
      - ai-ecommerce-network

volumes:
  postgres_data:
  
networks:
  ai-ecommerce-network:
    driver: bridge